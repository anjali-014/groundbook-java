# Every setting can come from the environment: an env-file passed to `docker run --env-file` is the only
# configuration input. DATABASE_URL, HOST and PORT are mapped here; HOLD_HOURS binds to hold-hours through
# Spring's relaxed binding.
spring:
  application:
    name: groundbook
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/groundbook}
  sql:
    init:
      mode: always

server:
  address: ${HOST:127.0.0.1}
  port: ${PORT:8080}

seed-dir: seed
hold-hours: 24